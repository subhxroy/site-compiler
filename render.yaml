# Render Blueprint Specification
# Deploys the SiteCompiler backend service to Render free-tier with Playwright dependencies and health router
services:
  - type: web
    name: sitecompiler-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000 && npx playwright install chromium
    startCommand: npm run start:backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://site-compiler.netlify.app
