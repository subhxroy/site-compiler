# Render Blueprint Specification
# Deploys the SiteCompiler backend service to Render free-tier with Playwright dependencies and health router
services:
  - type: web
    name: sitecompiler-backend
    env: node
    plan: free
    region: oregon
    # Install browsers INTO the project dir (./pw-browsers) — the ONLY directory that
    # survives between Render's build and runtime phases. /opt/render/.cache does NOT persist.
    buildCommand: npm install --fetch-retries=5 && PLAYWRIGHT_BROWSERS_PATH=./pw-browsers npx playwright install chromium
    startCommand: npm run start:backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: ./pw-browsers
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://site-compiler.netlify.app
