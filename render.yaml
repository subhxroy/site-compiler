# Render Blueprint Specification
# Deploys the SiteCompiler backend service to Render free-tier with Playwright dependencies and health router
services:
  - type: web
    name: sitecompiler-backend
    env: node
    plan: free
    region: oregon
    # Install browsers INTO the project dir (./pw-browsers) — the ONLY directory that
    # survives between Render's build and runtime phases. /opt/render/.cache does NOT persist.
    # Only chromium is needed; installing all browsers wastes ~320MB and slows builds.
    buildCommand: npm install --fetch-retries=5 && PLAYWRIGHT_BROWSERS_PATH=./pw-browsers npx playwright install chromium
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: ./pw-browsers
      - key: PORT
        value: 10000
      - key: FRONTEND_URL
        value: https://site-compiler.netlify.app
      - key: ADMIN_BYPASS_SECRET
        # Shared secret used by the Netlify download route (BACKEND_ADMIN_SECRET)
        # to bypass the payment gate for verified admins and Firestore-approved
        # payments. MUST match the BACKEND_ADMIN_SECRET env var set in the
        # Netlify dashboard.
        #
        # SECURITY: no value is committed here. Generate a fresh secret, then
        # set it manually in BOTH the Render dashboard (as ADMIN_BYPASS_SECRET)
        # and the Netlify dashboard (as BACKEND_ADMIN_SECRET). A value synced
        # from this file would land in git history and defeat the payment gate.
        # Missing value == fail closed (downloads blocked) until configured.
        sync: false
